<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מה מסתתר בין השורות?</title>
<meta name="description" content="משחק כתיבה: רואים רמזים, מגלים רגשות, כותבים סיפור שאפשר להרגיש.">
<style>
:root{--bg:#fff8ee;--paper:#ffffff;--ink:#1f2937;--muted:#5b6472;--line:#e6dccb;--pri:#2f5d8a;--pri-ink:#fff;--acc:#d9572b;--ok:#1f7a5c;--warn:#9a5b00;--soft:#f3ede2;--focus:#ffb703;--chip:#eef3f8;--chip-on:#2f5d8a;--shadow:0 6px 20px rgba(60,40,10,.10)}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Arial Hebrew",Arial,"Noto Sans Hebrew",sans-serif;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 18px;background:#fffdf8;border-bottom:2px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.brand{background:none;border:0;font-weight:800;font-size:1.15rem;color:var(--pri);cursor:pointer;padding:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:2px solid transparent;background:var(--soft);border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer;min-height:44px}
.tabs button[aria-current="page"]{background:var(--pri);color:#fff}
.tools{display:flex;gap:8px;align-items:center;margin-inline-start:auto;flex-wrap:wrap}
.tools button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;min-height:40px;font-size:.85rem}
.tools button[aria-pressed="true"]{border-color:var(--pri);background:#e4edf6}
#saveStatus{font-size:.8rem;color:var(--muted);min-width:5em}
#banner[hidden]{display:none}
#banner{background:#fff3cd;border-bottom:2px solid #e9c46a;padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
main{max-width:1500px;margin:0 auto;padding:18px 18px 60px;outline:none}
h1{font-size:2.3rem;margin:.2em 0;color:var(--pri);line-height:1.2}
h2{font-size:1.5rem;margin:.2em 0 .4em}
h3{font-size:1.15rem;margin:1.1em 0 .4em}
h4{margin:.9em 0 .3em}
.small{font-size:.85rem;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.center{justify-content:center;margin:12px 0}
.btn{border:2px solid #c9bfae;background:#fff;border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:600;min-height:44px;transition:transform .05s}
.btn:hover:not(:disabled){border-color:var(--pri)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:hover:not(:disabled){background:#244a6f}
.btn.big{font-size:1.1rem;padding:12px 22px;min-height:52px}
.btn.small{padding:6px 12px;font-size:.9rem;min-height:40px}
.btn.tiny{padding:3px 10px;font-size:.85rem;min-height:36px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:2px solid #c8d3df;background:var(--chip);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:40px;font-size:.92rem}
.chip.on{background:var(--chip-on);border-color:var(--chip-on);color:#fff;font-weight:700}
.chip.on::before{content:"✓ "}
.chip:disabled{opacity:.5;cursor:not-allowed}
input:not([type]),input[type=text],textarea{width:100%;border:2px solid #cfc5b4;border-radius:12px;padding:10px 12px;background:#fff;font-size:1rem}
textarea{resize:vertical;min-height:2.8em}
label.q,.q{display:block;font-weight:700;margin:.9em 0 .3em}
.checkline{display:flex;gap:10px;align-items:flex-start;margin:.5em 0;cursor:pointer}
.checkline input{width:22px;height:22px;flex:none;margin-top:3px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* בית */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;background:#fff;border-radius:24px;padding:24px 28px;box-shadow:var(--shadow);border:2px solid var(--line)}
.sub{font-size:1.25rem;font-weight:700;color:var(--acc);margin:.2em 0 .8em}
.lead{font-size:1.15rem}
.note{background:var(--soft);border-radius:12px;padding:10px 14px}
.hero>*{min-width:0}
.hero-svg{width:100%;height:auto;border-radius:18px;display:block}
main:focus,main:focus-visible{outline:none}
body{overflow-x:clip}
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0;list-style:none;margin:22px 0;counter-reset:r}
.road li{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
/* במה */
.work{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);gap:20px;align-items:start}
.stage-col{position:sticky;top:78px}
.stage-frame{background:#fff;border-radius:18px;border:3px solid #d9cdb8;overflow:hidden;box-shadow:var(--shadow)}
.stage{display:block;line-height:0}
.stage svg{width:100%;height:auto;display:block}
.stage:focus-visible{outline:4px solid var(--focus);outline-offset:-4px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.controls .pp{min-width:9.5em}
.scrub{flex:1 1 140px;min-width:120px;accent-color:var(--pri);height:30px}
.steplabel{font-weight:700;color:var(--pri)}
.stage-extra{margin-top:10px}
.panel{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);min-height:300px}
.context{font-size:1.1rem;background:var(--soft);border-radius:12px;padding:10px 14px}
.mainact{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px;padding-top:12px;border-top:2px dashed var(--line)}
/* מגלים */
.learn-top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:14px}
.progress{display:flex;gap:12px;align-items:center}
.plabel{font-weight:800;font-size:1.15rem}
.dots{display:flex;gap:6px}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid #c9bfae;background:#fff;font-weight:800;cursor:pointer}
.dot.cur{border-color:var(--pri);box-shadow:0 0 0 3px #cfe0f0}
.dot.done{background:#e3f2ec;border-color:var(--ok)}
.dot.done::after{content:"✓";font-size:.7em;margin-inline-start:1px}
.cardsbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mcards{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.mcard{width:96px;min-height:56px;border:2px dashed #c9bfae;border-radius:10px;padding:4px 6px;background:#fff;display:flex;flex-direction:column;font-size:.75rem;line-height:1.25}
.mcard .mc-name{font-weight:800;font-size:.95rem}
.mcard.got{border-style:solid;border-color:var(--acc);background:#fff1ea}
.mcard:not(.got) .mc-q{color:#9a9a9a}
.moments{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.moment{border:3px solid #ddd;border-radius:12px;background:#fff;padding:3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.85rem}
.moment svg{width:100%;height:auto;border-radius:8px}
.moment.on{border-color:var(--acc);background:#fff1ea;font-weight:800}
.moment.on span::before{content:"✓ "}
.hintbox{margin-top:12px}
.hint{background:#fffbe6;border-inline-start:5px solid #e9c46a;padding:6px 10px;border-radius:8px;margin:.4em 0}
.rtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.rtab{border:2px solid var(--line);background:var(--soft);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:700;min-height:40px;font-size:.9rem}
.rtab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare .card{padding:12px 14px}
.compare .mine{border-color:#8fb3d9}
.compare .author{border-color:#e7a27f;background:#fffaf6}
.compare h3{margin-top:0;font-size:1rem}
.ans{font-size:1.1rem;font-weight:700}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.mini{display:flex;flex-direction:column;align-items:center;font-size:.75rem}
.mini svg{border-radius:6px;border:1px solid #ddd}
.tellshow{background:var(--soft);border-radius:12px;padding:10px 14px;margin-top:12px}
.tellshow p{margin:.3em 0}
blockquote.para{font-size:1.15rem;line-height:2;background:#fffdf7;border-inline-start:6px solid var(--acc);margin:10px 0;padding:10px 16px;border-radius:10px}
.small-para{font-size:1.02rem}
.clue{background:#ffe8a8;border:0;border-bottom:3px solid #d99a00;border-radius:6px;padding:0 4px;cursor:pointer;font-weight:700;font-size:inherit;line-height:1.7}
.clue.on{background:#ffd166;outline:3px solid #d99a00}
.explain{min-height:64px;background:#f4f8fc;border-radius:12px;padding:6px 14px}
.big-note{font-weight:800;font-size:1.1rem;color:var(--pri)}
.cardgot{background:#fff1ea;border:2px solid var(--acc);border-radius:12px;padding:8px 12px}
/* יוצרים */
.create-head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.create-head h2{margin:0}
.lead2{font-weight:600;margin:.3em 0}
.challenge{margin-inline-start:auto}
.challenge.on{background:#fff1ea;border-color:var(--acc)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.stepb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:44px}
.stepb.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.charcard{border:3px solid #ddd;border-radius:14px;background:#fff;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:700}
.charcard.on{border-color:var(--acc);background:#fff1ea}
.charcard svg{width:100%;max-width:64px;height:auto}
details.private,details.unsupported{background:#f6f1fb;border:2px solid #d7c8ec;border-radius:14px;padding:8px 14px;margin-top:16px}
details summary{cursor:pointer;font-weight:800;min-height:36px;display:flex;align-items:center}
.examples{margin-top:16px;background:#fdf6ec;border:2px solid #f0d9b5;border-radius:14px;padding:6px 14px 12px}
.ex{border-top:1px dashed #e3c89a;padding:8px 0}
.extext{font-size:1.05rem;margin:.2em 0}
.sents{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.sent{background:#fffdf8;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.sent label{font-weight:800}
.sent.active{border-color:var(--acc);box-shadow:0 0 0 4px #ffd8c7}
.sent-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.st{font-size:.82rem;padding:3px 10px;border-radius:999px;border:2px solid;font-weight:700}
.st-none{border-color:#c9bfae;color:#6b6152;background:#fbf8f2;border-style:dashed}
.st-narr{border-color:#9aa5b8;color:#3f4b5e}
.st-draft{border-color:#e9c46a;color:#7a5a00;background:#fffbe6}
.st-recheck{border-color:#e76f51;color:#9d2c12;background:#fff1ec}
.st-recheck::before{content:"⚠ "}
.st-ok{border-color:var(--ok);color:var(--ok);background:#eaf6f1}
.st-ok::before{content:"✓ "}
.emo-note{background:#fffbe6;border-radius:10px;padding:6px 10px;margin:.4em 0 0;font-size:.92rem}
.prompts{background:var(--soft);border-radius:12px;padding:8px 30px}
.para-preview{background:#fffdf7;border:2px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:1.08rem;white-space:pre-wrap}
.stext{white-space:pre-wrap}
.big-s{font-size:1.15rem;font-weight:600}
.desc{margin:.3em 0 0}
.side-by-side{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--soft);border-radius:12px;padding:6px 12px;margin:10px 0}
.side-by-side h4{margin:.3em 0}
.grp{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.glab{flex:none;width:4.6em;font-weight:700;padding-top:8px;font-size:.92rem}
.chosen{background:#eef5fb;border-radius:12px;padding:6px 30px}
.chosen li{margin:4px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dirs{margin-inline-start:6px}
.speech-pick{background:#fff;border:2px solid #222;border-radius:16px;padding:6px 12px;display:inline-block}
.warn{color:#9d2c12;font-weight:700}
.notes{background:#fffbe6;border-radius:10px;padding:6px 30px;font-size:.9rem}
.checks{list-style:none;padding:0}
.versions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
#stageNote{margin-top:6px;font-weight:700;color:var(--acc)}
/* מציגים */
.present{background:var(--bg);padding:4px}
.present:fullscreen{overflow:auto;padding:20px}
.present-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.present-head h2{font-size:2rem;margin:0}
.present-stage{max-width:1100px;margin:10px auto 0}
.story-text{max-width:1100px;margin:10px auto;font-size:1.45rem;line-height:1.9;background:#fff;border-radius:16px;padding:12px 20px;border:2px solid var(--line);white-space:pre-wrap}
.story-text span.active{background:#ffe8a8;box-shadow:0 0 0 3px #ffe8a8;border-radius:6px}
.present-cols{max-width:1100px;margin:14px auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.reveal-feel{font-size:1.5rem;font-weight:800;color:var(--acc)}
/* תוצר */
.product .card{margin-bottom:16px}
.download{border-color:var(--pri)}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within{outline:4px solid var(--focus)}
/* חלון */
#modal[hidden]{display:none}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:18px;padding:20px 22px;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.3);font-size:1.05rem}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(120px);background:#1f2937;color:#fff;padding:10px 18px;border-radius:12px;transition:transform .25s;z-index:60;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:1100px){.work{grid-template-columns:1fr}.stage-col{position:static}.chars{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){html{font-size:17px}.hero{grid-template-columns:1fr}.road{grid-template-columns:1fr 1fr}.grid2,.compare,.present-cols,.versions,.side-by-side{grid-template-columns:1fr}.tools{margin-inline-start:0}h1{font-size:1.8rem}}
@media print{.topbar,.controls,#banner{display:none}}

</style>
</head>
<body>
<header class="topbar">
  <button class="brand" data-go="home" type="button">מה מסתתר בין השורות?</button>
  <nav class="tabs" aria-label="אזורי המשחק">
    <button type="button" data-go="learn">מגלים</button>
    <button type="button" data-go="create">יוצרים</button>
    <button type="button" data-go="present">מציגים</button>
    <button type="button" data-go="product">התוצר שלי</button>
  </nav>
  <div class="tools">
    <button type="button" id="muteBtn" aria-pressed="false">🔊 צליל פועל</button>
    <button type="button" id="stepsBtn" aria-pressed="false">🖼 תמונות לפי צעדים</button>
    <span id="saveStatus" role="status"></span>
  </div>
</header>
<div id="banner" hidden></div>
<main id="app" tabindex="-1"></main>
<div id="live" class="sr" aria-live="polite"></div>
<div id="toast" aria-hidden="true"></div>
<div id="modal" hidden></div>
<script>
/* ---- engine.js ---- */
'use strict';
/* =====================================================================
   מנוע במה: ציר זמן דטרמיניסטי -> מצב -> SVG
   כל רגע בסרט הוא פונקציה טהורה של הזמן t, ולכן עצירה, קפיצה לרגע
   והפקת תמונה לוורד משחזרים בדיוק את אותו מצב.
   ===================================================================== */
const W = 800, H = 450, GROUND = 400;
const L1 = 44, L2 = 42;               // אורך זרוע עליונה / אמה
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const f1 = v => Math.round(v * 10) / 10;
const DEG = Math.PI / 180;
const EASE = {
  lin: k => k,
  io: k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2,
  out: k => 1 - Math.pow(1 - k, 3),
  in: k => k * k * k,
  bounce: k => { const n = 7.5625, d = 2.75;
    if (k < 1 / d) return n * k * k;
    if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75;
    if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375;
    return n * (k -= 2.625 / d) * k + .984375; },
  back: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); }
};
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------------- דמויות ---------------- */
const CHARS = {
  uri:   { name: 'אורי',  g: 'm', skin: '#f2c48d', hair: '#5b3a1e', style: 'short', shirt: '#3a86ff', pants: '#33415c', shoe: '#2b2b2b', detail: 'pocket' },
  maya:  { name: 'מאיה',  g: 'f', skin: '#dfa86b', hair: '#2b1b12', style: 'pony',  shirt: '#ff7b54', pants: '#2a7f78', shoe: '#5c2a1e', detail: 'collar' },
  eitan: { name: 'איתן',  g: 'm', skin: '#b97a45', hair: '#1d1d1d', style: 'curly', shirt: '#3c9d6e', pants: '#3d405b', shoe: '#222',    detail: 'stripe', glasses: true },
  lia:   { name: 'ליה',   g: 'f', skin: '#ffdcb5', hair: '#b5482a', style: 'long',  shirt: '#8e57d8', pants: '#264653', shoe: '#3a2a4a', detail: 'collar' },
  noam:  { name: 'נועם',  g: 'm', skin: '#8d5a3b', hair: '#1a1110', style: 'buzz',  shirt: '#f4a261', pants: '#2b2d42', shoe: '#1e1e1e', detail: 'stripe' },
  noa:   { name: 'נועה',  g: 'f', skin: '#f6d5b8', hair: '#d9a93a', style: 'bun',   shirt: '#e5486e', pants: '#355070', shoe: '#40263a', detail: 'pocket' }
};
const CHAR_ORDER = ['uri', 'maya', 'eitan', 'lia', 'noam', 'noa'];

function charBase(x) {
  return { 'c.x': x, 'c.y': 0, 'c.sit': 0, 'c.lean': 0, 'c.turn': 0, 'c.sh': 0, 'c.tilt': 0, 'c.down': 0,
    'c.lx': 0, 'c.ly': 0, 'c.wide': 0, 'c.close': 0, 'c.bup': 0, 'c.bin': 0, 'c.smile': 0, 'c.open': 0, 'c.tight': 0,
    'c.aAs': 10, 'c.aAe': 6, 'c.aAf': 0, 'c.aAsl': 0, 'c.aApt': 0, 'c.aBs': 10, 'c.aBe': 6, 'c.aBf': 0, 'c.aBsl': 0, 'c.aBpt': 0,
    'c.walk': 0, 'c.wamp': 1, 'c.puff': 0, 'c.scale': 1 };
}

function rotP(px, py, cx, cy, deg) {
  if (!deg) return [px, py];
  const r = deg * DEG, c = Math.cos(r), s = Math.sin(r), dx = px - cx, dy = py - cy;
  return [cx + dx * c - dy * s, cy + dx * s + dy * c];
}
function armPts(sx, sy, s, e, mir) {
  const r = s * DEG, f = (s - e) * DEG;
  const ex = sx + mir * (-Math.sin(r)) * L1, ey = sy + Math.cos(r) * L1;
  const hx = ex + mir * (-Math.sin(f)) * L2, hy = ey + Math.cos(f) * L2;
  return [ex, ey, hx, hy];
}
/* קינמטיקה: מיקומי מפרקים במרחב הדמות ובעולם */
function kin(s) {
  const sit = s['c.sit'], sh = s['c.sh'], lean = s['c.lean'];

const Players = new Set();
const Engine = { stepMode: false, stopAll() { for (const p of Players) p.stop(); } };
class Player {
  constructor(host, o) {
    o = o || {}; this.host = host; this.label = o.label || 'במה';
    host.innerHTML = `<svg class="stage-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(this.label)}" xmlns="http://www.w3.org/2000/svg"><g class="dyn"></g></svg>`;
    this.svg = host.querySelector('svg'); this.dyn = this.svg.querySelector('.dyn');
    this.tl = null; this.setup = null; this.t = 0; this.playing = false; this.raf = 0; this.r0 = 0; this.r1 = 0;
    this.onTick = null; this.onState = null; this.onEnd = null; Players.add(this);
  }
  setLabel(l) { this.svg.setAttribute('aria-label', l); }
  load(tl, setup, t) { this.stop(); this.tl = tl; this.setup = setup; this.r0 = 0; this.r1 = tl.dur; this.seek(t == null ? 0 : t); }
  range(a, b) { this.r0 = a; this.r1 = b; }
  render() { if (!this.tl) return; this.dyn.innerHTML = stageInner(this.tl, this.setup, this.t); if (this.onTick) this.onTick(this.t); }
  seek(t) { if (!this.tl) return; this.t = clamp(t, 0, this.tl.dur); this.render(); }
  steps() {
    const ks = new Set();
    (this.tl.keys || []).forEach(k => { if (k >= this.r0 - 1e-6 && k <= this.r1 + 1e-6) ks.add(Math.round(k * 100) / 100); });
    ks.add(Math.round(this.r1 * 100) / 100);
    return [...ks].sort((a, b) => a - b);
  }
  stepIndex() { const st = this.steps(); let i = -1; st.forEach((k, j) => { if (this.t >= k - .02) i = j; }); return { i, n: st.length, st }; }
  step(dir) {
    if (!this.tl) return; this.pause(); Sound.ensure();
    const { i, st } = this.stepIndex(); let j = clamp(i + dir, 0, st.length - 1);
    if (dir > 0 && i < 0) j = 0;
    const t0 = this.t, t1 = st[j];
    if (t1 > t0) for (const sd of this.tl.sounds) if (sd.at > t0 && sd.at <= t1 + 1e-6) Sound.play(sd.name, sd.vol);
    this.seek(t1); this._notify();
  }
  play() {
    if (!this.tl) return; Sound.ensure();
    for (const p of Players) if (p !== this) p.stop();
    if (Engine.stepMode) { if (this.t >= this.r1 - .02 || this.t < this.r0) this.seek(this.r0); this.step(1); return; }
    if (this.t >= this.r1 - .01 || this.t < this.r0 - .01) this.seek(this.r0);
    this.playing = true; this.last = performance.now(); cancelAnimationFrame(this.raf);
    this.raf = requestAnimationFrame(this._frame); this._notify();
  }
  _frame = (now) => {
    if (!this.playing) return;
    const dt = Math.min(.05, Math.max(0, (now - this.last) / 1000)); this.last = now;
    const t0 = this.t, t1 = Math.min(this.r1, t0 + dt);
    for (const sd of this.tl.sounds) if (sd.at > t0 && sd.at <= t1) Sound.play(sd.name, sd.vol);
    this.t = t1; this.render();
    if (t1 >= this.r1 - 1e-6) { this.playing = false; this.raf = 0; this._notify(); if (this.onEnd) this.onEnd(); return; }
    this.raf = requestAnimationFrame(this._frame);
  };
  pause() { const was = this.playing; this.playing = false; cancelAnimationFrame(this.raf); this.raf = 0; Sound.stopAll(); if (was) this._notify(); }
  toggle() { if (this.playing) this.pause(); else this.play(); }
  restart() { this.pause(); this.seek(this.r0); this.play(); }
  stop() { this.playing = false; cancelAnimationFrame(this.raf); this.raf = 0; Sound.stopAll(); this._notify(); }
  _notify() { if (this.onState) this.onState(this); }
  destroy() { this.stop(); Players.delete(this); }
}

/* ---------------- הפקת PNG מהבמה ---------------- */
function svgToPngBytes(svgStr, scale) {
  scale = scale || 2;
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' }));
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = W * scale; c.height = H * scale;
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => { if (!b) return rej(new Error('toBlob')); b.arrayBuffer().then(ab => res(new Uint8Array(ab))); }, 'image/png');
      } catch (e) { rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('svg image')); };
    img.src = url;
  });
}

class StageUI {
  constructor(host, o) {
    o = o || {};
    host.innerHTML = `<div class="stage-frame"><div class="stage" tabindex="0"></div></div>
      <div class="controls" role="group" aria-label="פקדי הסרט">

        <button class="btn prev" type="button" aria-label="רגע קודם">→ רגע קודם</button>
        <button class="btn next" type="button" aria-label="רגע הבא">רגע הבא ←</button>
        <input class="scrub" type="range" min="0" max="1000" value="0" aria-label="מיקום בסרט">
        <span class="steplabel" aria-live="off"></span>
      </div>`;
    this.host = host; this.o = o;
    this.p = new Player($('.stage', host), { label: o.label || 'במה' });
    this.btn = { pp: $('.pp', host), restart: $('.restart', host), prev: $('.prev', host), next: $('.next', host) };
    this.scrub = $('.scrub', host); this.lab = $('.steplabel', host);
    this.btn.pp.onclick = () => { this.p.r1 > 0 && (this.clipEnd = null); if (Engine.stepMode) this.p.step(1); else this.p.toggle(); this.sync(); if (o.onUser) o.onUser('play'); };
    this.btn.restart.onclick = () => { if (Engine.stepMode) { this.p.pause(); this.p.seek(this.p.r0); this.sync(); } else this.p.restart(); if (o.onUser) o.onUser('restart'); };
    this.btn.prev.onclick = () => { this.p.step(-1); this.sync(); };
    this.btn.next.onclick = () => { this.p.step(1); this.sync(); if (o.onUser) o.onUser('next'); };
    this.scrub.oninput = () => { this.p.pause(); const r = this.p.r1 - this.p.r0; this.p.seek(this.p.r0 + r * this.scrub.value / 1000); this.sync(); };
    $('.stage', host).addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); this.btn.pp.click(); } if (e.key === 'ArrowLeft') { e.preventDefault(); this.btn.next.click(); } if (e.key === 'ArrowRight') { e.preventDefault(); this.btn.prev.click(); } });
    this.p.onState = () => this.sync();
    this.p.onTick = t => { const r = this.p.r1 - this.p.r0; this.scrub.value = r > 0 ? Math.round((t - this.p.r0) / r * 1000) : 0; if (o.onTick) o.onTick(t); };
    this.p.onEnd = () => { if (this.full) { const t = this.p.t; this.p.range(0, this.p.tl.dur); this.p.t = t; this.full = false; } this.sync(); if (o.onEnd) o.onEnd(); };
    this.sync();
  }
  load(tl, setup, t) { this.full = false; this.p.load(tl, setup, t); this.sync(); }
  clip(a, b, freezeOnly) {
    this.p.pause(); Sound.ensure();
    if (Engine.stepMode || freezeOnly) { this.p.range(0, this.p.tl.dur); this.p.seek(b); this.sync(); return; }
    this.p.range(a, b); this.full = true; this.p.seek(a); this.p.play(); this.sync();
  }
  playAll() { this.p.pause(); this.p.range(0, this.p.tl.dur); this.full = false; this.p.seek(0); this.p.play(); this.sync(); }
  sync() {
    const p = this.p, sm = Engine.stepMode;
    this.btn.pp.textContent = sm ? '▶ הצעד הבא' : (p.playing ? '⏸ עצירה' : '▶ הפעלה');
    this.btn.pp.setAttribute('aria-pressed', p.playing ? 'true' : 'false');
    this.btn.prev.textContent = sm ? '→ צעד קודם' : '→ רגע קודם'; this.btn.next.textContent = sm ? 'צעד הבא ←' : 'רגע הבא ←';
    this.btn.prev.setAttribute('aria-label', sm ? 'צעד קודם' : 'רגע קודם'); this.btn.next.setAttribute('aria-label', sm ? 'צעד הבא' : 'רגע הבא');
    if (p.tl && sm) { const si = p.stepIndex(); this.lab.textContent = `צעד ${Math.max(0, si.i + 1)} מתוך ${si.n}`; } else this.lab.textContent = '';
    this.host.classList.toggle('playing', p.playing);
  }
  destroy() { this.p.destroy(); }
}

function go(screen, opt) {
  Engine.stopAll();
  if (current && current.unmount) current.unmount();
  S.screen = screen; save();
  $$('.tabs [data-go]').forEach(b => { if (b.dataset.go === screen) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  document.body.dataset.screen = screen;

  app.focus({ preventScroll: true }); window.scrollTo(0, 0);

}

function publicModel(ws) { // מודל ללא שדות סודיים — לבמה בכיתה ולייצוא
  ws = ws || S.ws;
  return { charId: ws.charId, place: ws.place, prop: ws.prop,
    sentences: ws.sentences.map(s => ({ id: s.id, text: s.text, dir: s.dir ? Object.assign({}, s.dir, { note: '', confirmedText: '' }) : null })) };
}
function storyParagraph(sentences) { return sentences.map(s => s.text.trim()).filter(Boolean).join(' '); }
function senStatus(s) {
  const d = s.dir;
  if (d && d.narration) return { k: 'narr', t: 'קריינות בלבד' };
  if (!dirHasStage(d)) return { k: 'none', t: 'למשפט הזה עוד לא בחרת המחשה' };
  if (d.speech && d.speech.text && !s.text.includes(d.speech.text)) return { k: 'recheck', t: 'בדקו שוב התאמה' };
  if (!d.confirmed) return { k: 'draft', t: 'עוד לא אישרתם התאמה' };
  if (d.confirmedText !== s.text) return { k: 'recheck', t: 'בדקו שוב התאמה' };
  return { k: 'ok', t: 'ההמחשה אושרה' };
}
let compileCache = { key: '', res: null };
function compiled(model) {

  if (compileCache.key !== key) compileCache = { key, res: compileStory(m) };
  return compileCache.res;
}

function imageCandidates() {
  const r = compiled(), out = [];
  r.spans.forEach(sp => {
    if (sp.kind !== 'stage') return; const i = S.ws.sentences.findIndex(s => s.id === sp.id) + 1;
    out.push({ sid: sp.id, kind: 'end', t: Math.max(sp.start, sp.end - .35), label: `סוף משפט ${i}` });
    if (sp.speechT) out.push({ sid: sp.id, kind: 'speech', t: sp.speechT, label: `הדיבור במשפט ${i}` });
  });
  return { r, out };
}

          <h3>תמונות לוורד <span class="small">(בחרו עד 3, לפי הסדר)</span></h3>
          ${out.length ? `<div class="moments">${out.map(c => { const k = sel.findIndex(im => im.sid === c.sid && im.kind === c.kind); return `<button type="button" class="moment${k >= 0 ? ' on' : ''}" data-act="img" data-sid="${c.sid}" data-kind="${c.kind}" aria-pressed="${k >= 0}">${stageSVG(r.tl, r.setup, c.t, 160, 90, 'aria-hidden="true"')}<span>${k >= 0 ? `(${k + 1}) ` : ''}${hx(c.label)}</span></button>`; }).join('')}</div>` : '<p class="muted">עוד אין משפטים עם המחשה, אז אין תמונות לבחור. אפשר להוריד טקסט בלבד.</p>'}
          <label class="checkline"><input type="checkbox" data-in="noImages" ${P.noImages ? 'checked' : ''}> להוריד טקסט בלבד, בלי תמונות</label>
        </div>
      </div>
      <div class="card download">
        <button class="btn primary big" data-act="docClass">⬇ הורדת הסיפור לכיתה — Word</button>
        <p>בוורד יופיעו הסיפור ותמונות מהרגעים שבחרתם. את האנימציה מציגים כאן במשחק.</p>
        <p class="small">הקובץ לכיתה לא כולל את הרגש שתכננתם, את ההסברים שלכם או את ניחושי הכיתה.</p>
        <button class="btn" data-act="docWriter">⬇ עותק לכותב ולמורה (כולל הכוונה)</button>
        <p class="small">העותק לכותב כולל עמוד נוסף עם הרגשות שתכננתם וההסבר. לא לחלק לכיתה.</p>
      </div>
      <div class="card"><h3>שמירה והעברה למחשב אחר</h3>
        <p class="small">${storageOK ? 'העבודה נשמרת אוטומטית בדפדפן הזה, במחשב הזה.' : 'הדפדפן הזה לא שומר אוטומטית — הורידו גיבוי.'} כדי להמשיך במחשב אחר: הורידו קובץ פרויקט, ופתחו אותו שם בכפתור "טעינת קובץ פרויקט".</p>
        <div class="row"><button class="btn" data-act="backup">⬇ הורדת קובץ פרויקט (גיבוי)</button><label class="btn filebtn">⬆ טעינת קובץ פרויקט<input type="file" id="loadFile" accept=".json,application/json" data-in="loadFile"></label></div>
        <p class="small">קובץ הפרויקט מיועד לכותב: יש בו גם את הכוונה הסודית. לכיתה — רק קובץ הוורד.</p>
        <p id="loadMsg" class="small" role="status"></p>
      </div></section>`;
  },
  inputs: {
    title(el) { S.product.title = el.value; save(); const e = findEmotionWords(el.value), n = $('#titleEmo'); n.hidden = !e.length; if (e.length) n.textContent = `הכותרת אולי מגלה את הרגש (${e.join(', ')}). אפשר לבחור כותרת שלא מסגירה.`; },
    author(el) { S.product.author = el.value; save(); },
    noImages(el) { S.product.noImages = el.checked; save(); },
    loadFile(el) { const f = el.files && el.files[0]; if (f) loadProjectFile(f); el.value = ''; }
  },
  acts: {
    img(el) { const P = S.product, sid = el.dataset.sid, kind = el.dataset.kind; const i = P.images.findIndex(im => im.sid === sid && im.kind === kind); if (i >= 0) P.images.splice(i, 1); else { if (P.images.length >= 3) { announce('אפשר לבחור עד שלוש תמונות.'); return; } P.images.push({ sid, kind }); } save(); go('product'); const b = $(`[data-act="img"][data-sid="${sid}"][data-kind="${kind}"]`); if (b) b.focus(); },
    docClass() { makeDoc('class'); }, docWriter() { makeDoc('writer'); },
    backup() { exportProject(); }
  }
};
async function makeDoc(kind) {
  try {
    const pm = publicModel(), P = S.product, imgs = [];
    if (!P.noImages) {
      const { r, out } = imageCandidates();
      for (const im of P.images) { const c = out.find(x => x.sid === im.sid && x.kind === im.kind); if (c) imgs.push(await svgToPngBytes(stageSVG(r.tl, r.setup, c.t, W, H), 2)); }
    }
    const model = { title: P.title.trim() || 'הסיפור שלי', author: P.author.trim(), paragraphs: [storyParagraph(pm.sentences)].filter(Boolean), images: imgs, readerSpace: true, writerPage: null };
    if (!model.paragraphs.length) model.paragraphs = [''];
    if (kind === 'writer') {
      const sc = S.ws.secret, ws = S.ws;
      const rows = [];
      if (ws.challenge) { rows.push(['שתי התחושות שתכננתי', [sc.a, sc.b].filter(Boolean).join(' + ')]); rows.push(['מה גרם לתחושה הראשונה', sc.causeA]); rows.push(['מה גרם לתחושה השנייה', sc.causeB]); if (sc.hidden) rows.push(['רגש שהדמות מנסה להסתיר', sc.hidden]); }
      else { rows.push(['הרגש שתכננתי', [...sc.emo, sc.other].filter(Boolean).join(', ')]); rows.push(['ההסבר של הכותב', sc.why]); }
      if (ws.situation) rows.push(['מצב הפתיחה', ws.situation]);
      ws.sentences.forEach((s, i) => { if (s.text.trim()) rows.push([`משפט ${i + 1} — ההמחשה`, (describeDir(s.dir) || 'בלי המחשה (קריינות)') + (s.dir && s.dir.note ? ' | הערת הכותב: ' + s.dir.note : '')]); });
      if (S.present.guesses.length) rows.push(['פרשנויות שנאספו בכיתה', S.present.guesses.map((x, i) => `${i + 1}. ${x.feel}${x.detail ? ' — ' + x.detail : ''}`).join('\n')]);
      const ck = [...CHECKLIST, ...(ws.challenge ? [CHECK_ADV] : [])].map(c => (ws.checks[c.id] ? '✓ ' : '○ ') + c.text).join('\n');
      rows.push(['רשימת הבדיקה של הכותב', ck]);
      model.writerPage = { rows };
    }
    const blob = buildDocx(model);
    downloadBlob(blob, kind === 'writer' ? 'הסיפור_שלי_עותק_לכותב.docx' : 'הסיפור_שלי_לכיתה.docx');
    announce(kind === 'writer' ? 'העותק לכותב ולמורה ירד.' : 'קובץ הוורד לכיתה ירד.');
  } catch (e) { announce('לא הצלחנו ליצור את הקובץ. נסו שוב, או הורידו טקסט בלבד.'); console.error(e); }
}
function loadProjectFile(file) {
  const msg = t => { const m = $('#loadMsg'); if (m) m.textContent = t; announce(t); };
  if (file.size > 3e6) { msg('הקובץ גדול מדי ואינו קובץ פרויקט של המשחק. הטיוטה שלכם לא השתנתה.'); return; }
  const fr = new FileReader();
  fr.onload = async () => {
    let ns;
    try { const o = JSON.parse(fr.result); if (!o || o.app !== APP_ID || !o.state) throw new Error('app'); ns = cleanState(o.state); }
    catch (e) { msg('זה לא קובץ פרויקט מתאים. הטיוטה שלכם לא השתנתה.'); return; }
    if (!(await askConfirm('לטעון את הפרויקט מהקובץ? הוא יחליף את הטיוטה שפתוחה עכשיו. (כדאי להוריד גיבוי קודם.)', 'טעינה', 'ביטול'))) { msg('הטעינה בוטלה. הטיוטה לא השתנתה.'); return; }
    ns.settings = S.settings; S = ns; S.screen = 'product'; compileCache = { key: '', res: null };
    saveNow(); go('product'); msg('הפרויקט נטען: הטקסט וההמחשות שוחזרו.');
  };
  fr.onerror = () => msg('לא הצלחנו לקרוא את הקובץ. הטיוטה לא השתנתה.');
  fr.readAsText(file);
}

/* ---------------- אתחול ---------------- */
function applySettings() {
  Sound.muted = S.settings.muted; Engine.stepMode = S.settings.steps;
  const m = $('#muteBtn'), st = $('#stepsBtn');
  m.setAttribute('aria-pressed', S.settings.muted); m.textContent = S.settings.muted ? '🔇 צליל כבוי' : '🔊 צליל פועל';
  st.setAttribute('aria-pressed', S.settings.steps); st.textContent = S.settings.steps ? '🖼 תמונות לפי צעדים: פועל' : '🖼 תמונות לפי צעדים';
  for (const p of Players) p._notify && p._notify();
}
function init() {
  S = loadState();
  if (!storageOK) showStorageBanner();
  applySettings();
  document.addEventListener('click', async e => {
    const nav = e.target.closest('[data-go]'); if (nav) { go(nav.dataset.go); return; }
    const ga = e.target.closest('[data-gact]');
    if (ga) { if (ga.dataset.gact === 'backup') exportProject(); return; }
    const el = e.target.closest('[data-act]'); if (!el || !current || !current.acts) return;
    if (el.disabled) return;
    const f = current.acts[el.dataset.act]; if (f) { e.preventDefault(); await f.call(current, el, e); }
  });
  const onIn = e => { const el = e.target.closest('[data-in]'); if (!el || !current || !current.inputs) return; const f = current.inputs[el.dataset.in]; if (f) f.call(current, el, e); };
  document.addEventListener('input', e => { const el = e.target; if (el && (el.type === 'checkbox' || el.type === 'file')) return; onIn(e); });
  document.addEventListener('change', e => { const el = e.target.closest('[data-in]'); if (el && (el.type === 'checkbox' || el.type === 'file')) onIn(e); });
  $('#muteBtn').onclick = () => { S.settings.muted = !S.settings.muted; if (S.settings.muted) Sound.stopAll(); save(); applySettings(); };
  $('#stepsBtn').onclick = () => { S.settings.steps = !S.settings.steps; Engine.stopAll(); save(); applySettings(); announce(S.settings.steps ? 'מצב תמונות לפי צעדים פועל: הסרטים מוצגים כצעדים קבועים.' : 'מצב תמונות לפי צעדים כבוי.'); };
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { saveNow(); Engine.stopAll(); } });
  go(S.screen || 'home');
}
document.addEventListener('DOMContentLoaded', init);

</script>
